name: security-review
description: Evaluates the security-review skill
type: capability
config:
  timeout: 2m
stimuli:
  - name: Flags SQL injection and a hardcoded secret
    prompt: >
      Run the security-review skill against this snippet and report findings:

      ```python
      API_KEY = "sk-live-abc123"

      def get_user(username):
          query = "SELECT * FROM users WHERE name = '" + username + "'"
          return db.execute(query)
      ```
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)(sql injection|injection)
      - type: output-matches
        config:
          pattern: (?i)(hardcoded|hard-coded).{0,40}(secret|key|credential)
      - type: prompt
    rubric:
      - Identifies the string-concatenated SQL query as an injection risk
      - Identifies the inline API_KEY as a hardcoded secret
      - Reports findings with a severity rating and a remediation step, per SKILL.md's output contract
