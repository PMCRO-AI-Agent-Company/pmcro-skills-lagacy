name: make-frame
version: 1

stimuli:
  - id: smoke
    prompt: "Execute a PlanFrame and report observable artifacts and evidence."
    graders:
      - type: output-matches
        config:
          pattern: (?i)(make|evidence|artifact|ground.?truth)

rubric:
