name: queue-enqueue
version: 1

stimuli:
  - id: smoke
    prompt: "Append a follow-up item to the shared colony queue without creating a private backlog."
    graders:
      - type: output-matches
        config:
          pattern: (?i)(queue|enqueue|priority|domain)

rubric:
  - "Uses the pmcro-loop skill contract and preserves the single shared colony queue."
  - "Separates the role-specific responsibility from other PMCR-O phases."
  - "Grounds state-changing claims in observable project state."