name: prompt-chaining
version: 1
stimuli:
  - id: smoke
    prompt: Design a prompt chain with explicit stage inputs, outputs, and validation between stages.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(stage|chain|validation)
rubric:
  - Uses explicit stage contracts and observable success criteria.
  - Adds complexity only when the pattern requires it.
