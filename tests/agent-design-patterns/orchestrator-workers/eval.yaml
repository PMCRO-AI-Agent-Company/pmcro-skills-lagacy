name: orchestrator-workers
version: 1
stimuli:
  - id: smoke
    prompt: Design an orchestrator-workers pattern with task decomposition, worker contracts, aggregation, and validation.
    graders:
      - type: output-matches
        config:
          pattern: (?i)(orchestrator|worker|aggregation|validation)
rubric:
  - Uses explicit stage contracts and observable success criteria.
  - Adds complexity only when the pattern requires it.
