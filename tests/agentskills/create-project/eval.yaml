name: create-project
description: Evaluates the whole-project Agent Skills generator
type: capability
config:
  timeout: 2m
stimuli:
  - name: Generates a project instance
    prompt: Generate an Agent Skills project named pmcro from two plugins.
    graders:
      - type: exit-success
      - type: output-matches
        config:
          pattern: (?i)(generated|project structure is valid)
      - type: prompt
    rubric:
      - Generates a complete project boundary rather than only one skill
      - Places the default instance under projects/<name>
      - Creates a project-local .agents environment and agent0
